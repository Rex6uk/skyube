[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skyube"
version = "1.0.0"
description = "Hardware health check + configuration advisor. Read-only, never fakes a reading."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rex6uk" }]
keywords = [
    "hardware", "system-monitor", "diagnostics", "hardware-info",
    "pc-health", "advisor", "windows", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/Rex6uk/skyube"
Issues = "https://github.com/Rex6uk/skyube/issues"

[project.scripts]
skyube = "hwtriage.cli:main"

[tool.setuptools]
packages = ["hwtriage", "hwtriage.collectors"]
