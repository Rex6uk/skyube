name: Release

# 打 tag（v1.0.0 这种）就自动建 Release 并把源码包传上去
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write      # 建 Release 需要

jobs:
  test:
    name: 自检测试（不过不发版）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install psutil
      - name: 跑自检（27 项）
        # 非 Windows 上部分采集器会走 psutil 分支，核心模型/阈值/渲染测试必须过
        run: python -m hwtriage.test_selftest

  release:
    name: 建 Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包源码
        run: |
          mkdir -p dist
          zip -r dist/hwtriage-${GITHUB_REF_NAME}.zip . \
            -x "*.git*" -x "dist/*" -x "__pycache__/*" -x "*.pyc"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
